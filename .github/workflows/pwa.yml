# PWA → GitHub Pages: оболочка приложения без данных игры (phone.json — по AirDrop).
# Один раз: Settings → Pages → Source: GitHub Actions.
name: pwa

on:
  push:
    branches: [main]
    paths:
      - apps/pwa/**
      - packages/core/**
      - pnpm-lock.yaml
      - .github/workflows/pwa.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @bgq/pwa build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/pwa/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
